name: Direct public weather data
on:
  workflow_dispatch:
concurrency:
  group: direct-weather-data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install scientific readers
        run: python -m pip install --no-cache-dir -r ingest/requirements.txt
      - name: Verify scientific transformations
        run: |
          python -m unittest discover -s ingest -p 'test_*.py'
          node --test tests/*.test.mjs
      - name: Refresh bounded data components
        id: refresh
        continue-on-error: true
        env:
          ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
        run: |
          export TERELLA_WEB_PYTHON="$(command -v python)"
          node ingest/refresh_all.mjs
      - name: Save completed data only
        if: always() && steps.refresh.outcome != 'skipped'
        run: |
          test -s data/current.json
          git config user.name 'Terella data job'
          git config user.email 'actions@users.noreply.github.com'
          git add data/current.json data/weather-archive.json data/aerosol-archive.json data/aerosol-candidate.json data/temperature-candidate.json data/climate-candidate.json
          if test -f data/last-refresh.json; then git add data/last-refresh.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh direct model data'
            git push
          fi
      - name: Report a failed component after preserving successful updates
        if: steps.refresh.outcome == 'failure'
        run: exit 1
